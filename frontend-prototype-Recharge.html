<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>充值活动 前台原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'PingFang SC','Helvetica Neue',Arial,sans-serif}
body{background:#eef1f5;color:#1a1a1a;display:flex;justify-content:center;align-items:flex-start;padding:28px;min-height:100vh}
/* 手机居中,控制台固定在右侧(与其他活动一致的居中布局) */
.panel{position:fixed;right:28px;top:28px;width:288px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 8px rgba(0,0,0,.08);max-height:calc(100vh - 56px);overflow-y:auto}
.panel h1{font-size:16px;color:#0b3f78;margin-bottom:4px}
.panel .sub{font-size:12px;color:#8a94a2;margin-bottom:16px;line-height:1.6}
.pgroup{margin-bottom:16px}
.plabel{font-size:12px;color:#5a6169;font-weight:600;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:0;border:1px solid #d6dee8;background:#f7f9fc;color:#333;border-radius:7px;padding:7px 6px;font-size:12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#0961BD;border-color:#0961BD;color:#fff}
.seg.col button{flex:1 1 100%}
.phone{position:relative;width:375px;flex-shrink:0;background:#000;border-radius:36px;padding:11px;box-shadow:0 12px 44px rgba(0,0,0,.3)}
/* 领取成功弹框(复用其他活动样式) */
.overlay{position:absolute;inset:11px;border-radius:26px;z-index:100;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.show{opacity:1;pointer-events:all}
.congrats-modal{background:#fff;border-radius:20px;width:280px;overflow:hidden;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.congrats-modal .c-img{height:128px;background:radial-gradient(120% 100% at 50% 22%,#7a3ad0,#2a1550);display:flex;align-items:center;justify-content:center}
.congrats-modal .c-img .c-emoji{font-size:52px}
.congrats-modal .c-body{padding:18px 24px 22px}
.congrats-modal .c-text{font-size:15px;color:#333;line-height:1.6;margin-bottom:20px}
.congrats-modal .c-amt{font-size:15px;font-weight:800;color:#e04a0a}
.congrats-modal .c-btn{width:100%;height:46px;border:none;border-radius:23px;background:linear-gradient(135deg,#f5c540,#df8808);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.fe-toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:120;white-space:nowrap}
.fe-toast.show{opacity:1}
.screen{background:#0c0c10;border-radius:26px;overflow:hidden;height:760px;overflow-y:auto;position:relative}
.screen::-webkit-scrollbar{width:0}
.nav{position:sticky;top:0;z-index:8;height:48px;display:flex;align-items:center;justify-content:center;background:#1a1a20;color:#d8d8dc;font-size:15px;font-weight:500}
.nav .back{position:absolute;left:14px;font-size:22px;color:#9a9aa2;font-weight:300}
.banner{position:relative;height:200px;overflow:hidden;background:#1c0f3a}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.coletavel{position:relative;z-index:4;margin:-30px auto 0;width:152px;height:56px;background:linear-gradient(180deg,#cf2b2b 0%,#7d1414 100%);border:2px solid #e9b24c;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 18px rgba(0,0,0,.5)}
.coletavel .lb{font-size:11px;color:#f4d093;line-height:1.2}
.coletavel .amt{font-size:23px;font-weight:800;color:#fff;line-height:1.05}
.body{padding:16px 16px 0}
.claimhint{display:flex;align-items:center;gap:5px;font-size:12px;color:#a6a6ae;margin-bottom:14px}
.claimhint .flag{color:#e23b3b}
.claimhint b{color:#f2c94c;font-weight:600}
.acc-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #22242c;margin-bottom:10px}
.acc-row .l{font-size:13px;color:#c8ccd4}
.acc-row .v{font-size:18px;font-weight:800;color:#ffd24a}
.acc-lines{margin-bottom:14px}.acc-lines .ln{display:flex;align-items:center;gap:6px;font-size:12px;color:#a6a6ae;margin:3px 0}
.acc-lines .tri{font-size:11px}
.acc-lines b{color:#f2c94c;font-weight:600}
.tbl-hd{display:flex;color:#8c8c94;font-size:12px;padding:0 2px 10px}
.tbl-hd .c1{flex:1}
.tbl-hd .c2{width:132px;padding-left:14px}
.tier{position:relative;height:48px;border-radius:8px;background:#24242b;margin-bottom:10px;display:flex;align-items:center;overflow:hidden}
.tier .amt-l{flex:1;padding-left:16px;color:#e2e2e6;font-size:13px;z-index:2}
.tier .rwd{position:absolute;top:0;right:0;height:100%;width:46%;background:#34341f;clip-path:polygon(14% 0,100% 0,100% 100%,0% 100%);display:flex;align-items:center;justify-content:center;color:#f5c542;font-weight:700;font-size:13px}
.seqhead{position:relative;z-index:3;margin:18px 14px 0;background:linear-gradient(100deg,#2b1e13 0%,#251a2c 100%);border:1px solid #4a3a20;border-radius:12px;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.seqhead .tag{position:absolute;top:-9px;left:14px;background:linear-gradient(90deg,#ff9a2e,#ff6a1e);color:#fff;font-size:10px;font-weight:700;padding:2px 9px;border-radius:6px;letter-spacing:.5px}
.seqhead .t1{font-size:16px;font-weight:800;color:#fff;line-height:1.4}
.seqhead .t2{font-size:11px;color:#b0a898;margin-top:4px}
.seqhead .prize{font-size:23px;font-weight:800;color:#ffd24a;white-space:nowrap}
.seqnote{font-size:11px;color:#8a8478;margin:9px 16px 0}
.prog{display:flex;align-items:center;gap:12px;background:#191c23;border-radius:12px;padding:12px 14px;margin:12px 0}
.ring{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:conic-gradient(#2ec07a var(--p),#333844 0)}
.ring i{width:38px;height:38px;border-radius:50%;background:#191c23;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800;color:#fff}
.prog .txt{flex:1;font-size:12px;color:#c8ccd4;line-height:1.4}
.prog .badge{background:#1f7a4d;color:#c7f6dc;font-size:11px;border-radius:14px;padding:5px 11px;white-space:nowrap}
.prog.done .badge{background:#2ec07a;color:#06381f}
.prog .dep{display:inline-flex;align-items:center;gap:5px;background:#1f7a3d;color:#eafff0;font-size:12px;font-weight:700;border-radius:8px;padding:6px 10px;white-space:nowrap;cursor:pointer}
.prog .dep .dep-ic{font-size:13px;line-height:1}
.prog .dep .dep-pg{background:rgba(0,0,0,.28);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800}
.daytabs{display:flex;align-items:center;gap:8px;padding:2px 0 12px;flex-wrap:nowrap;overflow:hidden}
.daytab{font-size:12px;padding:4px 11px;border-radius:13px;background:#20242c;color:#9aa0aa;cursor:pointer;white-space:nowrap}
.daytab.on{background:#f5e000;color:#3a3300;font-weight:700}
.daytab .tk{margin-left:4px;font-weight:700}
.daytab .tk.d{color:#2ec07a}
.daytab .tk.c{color:#f5c542}
.daytab.on .tk.d{color:#0a7d3e}
.daytab.on .tk.c{color:#8a5a00}
/* 天数轨道:可手动左右滑动,吸附对齐,隐藏滚动条;"今天"标记在卡片外部下方 */
.track{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.cells{position:relative;display:flex;gap:8px;flex:1;min-width:0;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:20px}
.cells::-webkit-scrollbar{display:none}
.cells .cell{flex:1;scroll-snap-align:start}
.cells.six .cell{flex:0 0 calc((100% - 40px)/6)}
.cell{min-width:0;height:62px;border-radius:11px;background:#191c23;border:1px solid #262a33;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.cell .d{font-size:12px;color:#c8ccd4}
.cell .ic{font-size:16px;line-height:1}
.cell .ic.lock{color:#5f6673}
.cell.hoje{background:#2a2410;border-color:#f5e000}
.cell.hoje .d{color:#f5e000;font-weight:700}
.cell .todaymk{position:absolute;bottom:-19px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:0;font-size:10px;color:#f5e000;line-height:1.05}
.cell .todaymk .mkar{font-size:8px;line-height:1;color:#f5e000}
/* 过去·已完成:绿勾、无边框(扁平,与当天已完成的高亮卡区分) */
.cell.done{background:#161922;border-color:transparent}
.cell.done .ic{color:#2ec07a}
/* 当天·已完成:与当天未完成相同的黄色高亮 + 黄色"今天",区别仅为卡片中间的绿色对勾 */
.cell.hoje-done .ic{color:#2ec07a}
.lastcell{flex-shrink:0;width:64px;height:62px;border-radius:11px;background:linear-gradient(160deg,#5a1a7e 0%,#8a3ad0 100%);border:1px solid #a45ae0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;box-shadow:0 0 12px rgba(138,58,208,.45)}
.lastcell .ld{font-size:11px;color:#f0dcff}
.lastcell .lic{font-size:15px;line-height:1}
.lastcell .p{font-size:11px;font-weight:800;color:#ffe08a}
.rules{margin-top:22px;padding-bottom:8px}
.rules .rt{text-align:center;color:#8c8c94;font-size:12px;margin-bottom:10px;letter-spacing:1px}
.rules .rt .dash{color:#c05a2e}
.rules .dt{color:#8c8c94;font-size:11px;margin-bottom:6px}
.rules ol{padding-left:16px;color:#6c6c74;font-size:11px;line-height:1.95}
.btnbar{position:sticky;bottom:0;z-index:6;padding:12px 0 16px;background:linear-gradient(180deg,rgba(12,12,16,0),#0c0c10 26%)}
.btn{margin:0 14px;height:48px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.btn.seqbtn{margin:10px 0 4px}
.btn.on{background:#f2e400;color:#3a3300;cursor:pointer}
.btn.off{background:#54541e;color:#a3a061}
.btn.done{background:#2b2e37;color:#7b8290}
</style>
</head>
<body>

<div class="panel">
  <h1>充值活动 · 前台原型</h1>
  <div class="sub">照竞品逐像素还原,葡语翻中文。控制台切换配置,右侧实时预览。</div>
  <div class="pgroup">
    <div class="plabel">活动条件</div>
    <div class="seg" id="seg-mode">
      <button data-v="first" class="on">首笔充值</button>
      <button data-v="single">单笔充值</button>
      <button data-v="accum">累计充值</button>
      <button data-v="days">连续天数</button>
    </div>
  </div>
  <div class="pgroup">
    <div class="plabel">登录状态</div>
    <div class="seg" id="seg-login">
      <button data-v="in" class="on">已登录</button>
      <button data-v="out">未登录</button>
    </div>
  </div>
  <div class="pgroup" id="grp-sreset" style="display:none">
    <div class="plabel">重置方式（单笔）</div>
    <div class="seg" id="seg-sreset">
      <button data-v="none">不重置</button>
      <button data-v="day" class="on">每日</button>
      <button data-v="week">每周</button>
    </div>
  </div>
  <div class="pgroup" id="grp-smax" style="display:none">
    <div class="plabel">获奖次数上限（单笔）</div>
    <div class="seg" id="seg-smax">
      <button data-v="0" class="on">0 · 不限</button>
      <button data-v="1">1 次</button>
      <button data-v="3">3 次</button>
    </div>
  </div>
  <div class="pgroup" id="grp-claim">
    <div class="plabel">领取时间</div>
    <div class="seg" id="seg-claim">
      <button data-v="realtime" class="on">实时领取</button>
      <button data-v="next">次日领取</button>
    </div>
  </div>
  <div class="pgroup" id="grp-state">
    <div class="plabel">状态</div>
    <div class="seg col" id="seg-state"></div>
  </div>
  <div class="pgroup" id="grp-days" style="display:none">
    <div class="plabel">连续天数预设</div>
    <div class="seg col" id="seg-days">
      <button data-v="2" class="on">2 天(当前第 1 天 · 未完成)</button>
      <button data-v="4">4 天(当前第 3 天 · 未完成)</button>
      <button data-v="10">10 天(当前第 3 天 · 已完成)</button>
      <button data-v="21">21 天(当前第 21 天 · 已完成 · 可领取)</button>
      <button data-v="21c">21 天(已领取 · 未重置)</button>
    </div>
  </div>
</div>

<div class="phone">
  <div class="screen" id="screen"></div>
  <div class="overlay" id="ov-congrats" onclick="if(event.target===this)closeCongrats()">
    <div class="congrats-modal">
      <div class="c-img"><div class="c-emoji">🎉🎁</div></div>
      <div class="c-body">
        <div class="c-text">恭喜您获得 <span class="c-amt" id="cg-amt">R$0,00</span> 奖金</div>
        <button class="c-btn" onclick="closeCongrats()">确认</button>
      </div>
    </div>
  </div>
  <div id="fe-toast" class="fe-toast"></div>
</div>

<script>
const S={mode:'first',claim:'realtime',state:'claimable',days:'2',dayTab:0,seqClaimed:false,login:'in',sreset:'day',smax:'0'};
const FIRST_TIERS=[[20,5],[40,10],[60,15]];
const ACCUM_TIERS=[[20,3],[40,7],[60,12]];
// 状态集(首笔2种 / 累计3种)
const STATE_SETS={
  first:[['claimable','可领取'],['zero','未达标 / 已领取']],
  accum:[['notstart','未开始'],['ongoing','进行中'],['alldone','全部完成']],
  single:[]   // 按"获奖次数上限"动态生成,见 singleStateSet()
};
// 单笔充值示例:本金+赠送;每笔按金额匹配达到的最高档(不叠加);重置方式 / 次数上限可在控制台切换
const SINGLE_TIERS=[[50,5],[100,12],[500,68]];
// 各状态下本周期已产生的奖励(每笔一条):充100得12、充60得5、再充500得68;1 次 → 充100得12 即用完
const SINGLE_STATE={
  notstart:{got:[],claimed:0},
  ongoing:{got:[12,5],claimed:0},
  claimed:{got:[12,5],claimed:17},
  alldone:{got:[12,5,68],claimed:17},
  one:{got:[12],claimed:0},
  oneclaimed:{got:[12],claimed:12}
};
function singleStateSet(){
  if(S.smax==='0') return [['notstart','未获奖'],['ongoing','已获奖 2 次 · 未领'],['claimed','已获奖 2 次 · 已领'],['alldone','已获奖 3 次 · 末笔未领']];
  if(S.smax==='1') return [['notstart','未获奖(0/1 次)'],['one','次数用完(1/1 次) · 未领'],['oneclaimed','次数用完(1/1 次) · 已领']];
  return [['notstart','未获奖(0/3 次)'],['ongoing','已获奖 2 次 · 未领'],['claimed','已获奖 2 次 · 已领'],['alldone','次数用完(3/3 次) · 末笔未领']];
}
// 周期词:标题/规则前缀、次数行前缀、规则第1条周期词
const SR={
  none:{prefix:'', cnt:'', left:'', period:'活动期间'},
  day:{prefix:'每日', cnt:'今日', left:'今日', period:'每日'},
  week:{prefix:'每周', cnt:'本周', left:'本周', period:'每周'}
};
function rulesSingle(){
  const r=SR[S.sreset], n=+S.smax;
  // 每日/每周按临时方案只能"过期"两项,示例取过期作废;不重置示例取保留天数类且过期天数=0(一直保留)
  const l2=S.sreset==='none'?'彩金需要手动领取，活动期间彩金将一直保留；':'彩金需要手动领取，过期后彩金将自动作废；';
  // 0 = 不限次数:每笔达标均赠送;1~99:周期内最多 N 次(1 次与多次同句式)
  const l1=n===0
    ? `本活动为${r.prefix}单笔充值活动，会员每笔充值满足要求均可获得相应彩金，不限次数；`
    : `本活动为${r.prefix}单笔充值活动，会员单笔充值满足要求，可获得相应彩金，${r.period}最多可获得 ${n} 次；`;
  return [
   l1,
   l2,
   '本金+彩金需 1 倍有效投注才能提现；',
   '仅限账号本人进行正常的人为操作，否则将取消或扣除奖励、冻结、甚至拉入黑名单；',
   '为避免文字理解差异，平台将保留本活动最终解释权。'];
}
// 系统默认活动规则（示例取参考原文；第1/2/3条随配置联动，见 PRD 5.7）
const RULES_FIRST=[
 '本活动为首笔充值活动，会员首笔充值满足要求，可获得相应彩金；',
 '彩金需要手动领取，活动期间彩金将一直保留；',
 '彩金（不含本金）需 1 倍有效投注才能提现；',
 '仅限账号本人进行正常的人为操作，否则将取消或扣除奖励、冻结、甚至拉入黑名单；',
 '为避免文字理解差异，平台将保留本活动最终解释权。'];
const RULES_ACCUM=[
 '本活动为每日累计充值活动，会员累计充值满足要求，可获得相应彩金；',
 '彩金需要手动领取，过期后彩金将自动作废；',
 '彩金（不含本金）需 1 倍有效投注才能提现；',
 '仅限账号本人进行正常的人为操作，否则将取消或扣除奖励、冻结、甚至拉入黑名单；',
 '为避免文字理解差异，平台将保留本活动最终解释权。'];
const RULES_SEQ=[
 '本活动为每周连续天数充值活动，会员完成连续天数充值要求，可获得相应彩金；',
 '彩金需要手动领取，彩金保留1天后自动派发；',
 '彩金（不含本金）需 1 倍有效投注才能提现；',
 '仅限账号本人进行正常的人为操作，否则将取消或扣除奖励、冻结、甚至拉入黑名单；',
 '为避免文字理解差异，平台将保留本活动最终解释权。'];
// done=实际已完成天数;today=哪天是"今天"(始终标记,0 表示无);today 是否已完成由 done 决定
const SEQ={ '2':{n:2,done:0,today:1}, '4':{n:4,done:2,today:3}, '10':{n:10,done:3,today:3}, '21':{n:21,done:21,today:0}, '21c':{n:21,done:21,today:0} };
const SEQ_PRIZE=7, SEQ_DAILY=10;
const money=n=>'R$'+Number(n).toFixed(2).replace('.',',');

function bannerSVG(){return `<svg viewBox="0 0 375 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
 <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0%" stop-color="#7a3ad0"/><stop offset="45%" stop-color="#3f1f86"/><stop offset="100%" stop-color="#180c34"/></radialGradient>
 <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="55%" stop-color="#ffcf6a" stop-opacity=".25"/><stop offset="100%" stop-color="#ffcf6a" stop-opacity="0"/></radialGradient>
 <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe27a"/><stop offset="100%" stop-color="#e0a020"/></linearGradient>
 <linearGradient id="gift" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff5a8a"/><stop offset="100%" stop-color="#c02060"/></linearGradient>
</defs>
<rect width="375" height="200" fill="url(#bg)"/>
<ellipse cx="187" cy="92" rx="150" ry="90" fill="url(#glow)"/>
${sparkles()}
<g transform="translate(150,66)">
 <rect x="0" y="34" width="76" height="52" rx="6" fill="url(#gift)"/>
 <rect x="0" y="24" width="76" height="18" rx="4" fill="#ff7aa6"/>
 <rect x="33" y="24" width="12" height="62" fill="#ffd24a"/>
 <path d="M38 24 C20 4 2 12 12 22 C18 28 32 24 38 24 Z" fill="#ffd24a"/>
 <path d="M38 24 C56 4 74 12 64 22 C58 28 44 24 38 24 Z" fill="#ffd24a"/>
</g>
${coinPile()}
</svg>`;}
function sparkles(){let s='';[[40,40],[320,50],[70,120],[300,120],[200,30],[110,60],[270,80]].forEach(p=>{s+=`<g transform="translate(${p[0]},${p[1]})" fill="#fff4c8" opacity=".85"><path d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z"/></g>`;});return s;}
function coinPile(){let s='';[[30,168],[58,178],[18,186],[46,192],[74,186],[300,170],[326,180],[348,188],[312,192],[286,184]].forEach(c=>{s+=`<ellipse cx="${c[0]}" cy="${c[1]}" rx="16" ry="13" fill="url(#coin)" stroke="#b47a10" stroke-width="1"/><ellipse cx="${c[0]}" cy="${c[1]-1}" rx="9" ry="7" fill="#ffefb0" opacity=".6"/>`;});return s;}

function openCongrats(amt){ document.getElementById('cg-amt').textContent=money(amt); document.getElementById('ov-congrats').classList.add('show'); }
function closeCongrats(){ document.getElementById('ov-congrats').classList.remove('show'); }
function goRecharge(){ const t=document.getElementById('fe-toast'); t.textContent='跳转到充值页…'; t.classList.add('show'); clearTimeout(window._ft); window._ft=setTimeout(()=>t.classList.remove('show'),1400); }
function render(){
  const sc=document.getElementById('screen');
  if(S.mode==='days'){ sc.innerHTML=renderSeq(); bindTabs(); }
  else if(S.mode==='single') sc.innerHTML=renderSingle();
  else sc.innerHTML=renderTiered();
}
const nav=t=>`<div class="nav"><span class="back">‹</span>${t}</div>`;
const rulesBlock=arr=>`<div class="rules"><div class="rt"><span class="dash">✂〰</span> 活动规则 <span class="dash">〰✂</span></div><div class="dt">活动详情:</div><ol>${arr.map(r=>`<li>${r}</li>`).join('')}</ol></div>`;
const claimHint=amt=>S.claim==='next'?`次日 02:00:00 之后可领取 <b>${money(amt)}</b>`:`今日可领 <b>${money(amt)}</b>`;

function renderTiered(){
  const isFirst=S.mode==='first';
  const title=isFirst?'首充奖励':'累计充值奖励';
  const tiers=isFirst?FIRST_TIERS:ACCUM_TIERS;
  let claimAmt=0, btn, mid;
  const guest=S.login==='out';
  const st = guest ? (isFirst?'zero':'notstart') : S.state;   // 未登录=各模式"未开始"基线
  if(isFirst){
    claimAmt = st==='claimable'?5:0;                    // 可领取=5,未达标/已领取/未登录=0
    // 次日领取时:即使达标,当天也不可领(仅展示次日可领金额)→ 按钮不可点
    btn = (st==='claimable' && S.claim!=='next')?`<div class="btn on" onclick="openCongrats(${claimAmt})">领取</div>`:`<div class="btn off">领取</div>`;
    mid = `<div class="claimhint"><span class="flag">🚩</span>${claimHint(claimAmt)}</div>`;
  }else{
    const acc = st==='notstart'?0:(st==='ongoing'?40:60);
    claimAmt = st==='notstart'?0:(st==='ongoing'?10:22);   // 全部完成:各档合计
    const highest=ACCUM_TIERS[ACCUM_TIERS.length-1][0];
    let line1;
    if(acc>=highest){ line1='所有充值挑战已完成!'; }
    else{
      const nx=ACCUM_TIERS.find(t=>t[0]>acc);
      line1 = claimAmt>0
        ? `已获得 <b>${money(claimAmt)}</b>,还差 <b>${money(nx[0]-acc)}</b> 即得奖励 <b>${money(nx[1])}</b>`
        : `还差 <b>${money(nx[0]-acc)}</b> 即可获得 <b>${money(nx[1])}</b>`;
    }
    btn = (claimAmt>0 && S.claim!=='next')?`<div class="btn on" onclick="openCongrats(${claimAmt})">领取</div>`:`<div class="btn off">领取</div>`;
    mid = `<div class="acc-row"><span class="l">累计充值</span><span class="v">${money(acc)}</span></div>`
        + `<div class="acc-lines"><div class="ln"><span class="tri">🎯</span>${line1}</div><div class="ln"><span class="tri">🎯</span>${claimHint(claimAmt)}</div></div>`;
  }
  const rows=tiers.map(t=>`<div class="tier"><span class="amt-l">${money(t[0])}</span><span class="rwd">+${money(t[1])}</span></div>`).join('');
  return nav(title)
   + `<div class="banner">${bannerSVG()}</div>`
   + `<div class="coletavel"><span class="lb">可领取</span><span class="amt">${money(claimAmt)}</span></div>`
   + `<div class="body">${mid}<div class="tbl-hd"><span class="c1">充值金额</span><span class="c2">奖励金额</span></div>${rows}${rulesBlock(isFirst?RULES_FIRST:RULES_ACCUM)}</div>`
   + `<div class="btnbar">${btn}</div>`;
}

// 单笔充值:顶部可领取 = 已获得 − 已领取;第1行看剩余次数;第2行按领取时间(每日重置锁定实时)
function renderSingle(){
  const guest=S.login==='out';
  const d=SINGLE_STATE[guest?'notstart':S.state]||SINGLE_STATE.notstart;
  const max=+S.smax, r=SR[S.sreset];
  const unlimited=max===0;   // 0 = 不限次数,每笔达标都送
  const used=d.got.length, left=max-used;
  const gotSum=d.got.reduce((a,b)=>a+b,0);
  const claimAmt=gotSum-d.claimed;
  const low=SINGLE_TIERS[0];
  const leftTxt=n=>`,${r.left?r.left:''}剩余 <b>${n}</b> 次`;
  let line1;
  if(unlimited){
    line1 = used===0
      ? `单笔充值满 <b>${money(low[0])}</b> 即可获得 <b>${money(low[1])}</b>,每笔都送`
      : `已获得 <b>${money(gotSum)}</b>,继续充值继续送`;
  }
  else if(left<=0) line1='所有充值挑战已完成!';
  else if(used===0) line1=`单笔充值满 <b>${money(low[0])}</b> 即可获得 <b>${money(low[1])}</b>${leftTxt(left)}`;
  else line1=`已获得 <b>${money(gotSum)}</b>${leftTxt(left)}`;
  // 单笔强制实时领取(无次日),提示固定"今日可领"
  const btn=claimAmt>0?`<div class="btn on" onclick="singleClaim(${claimAmt})">领取</div>`:`<div class="btn off">领取</div>`;
  const hint2=`今日可领 <b>${money(claimAmt)}</b>`;
  // 限次(1 次与多次同样式):次数行 used/N;不限次:不显示次数行,靠第1行"每笔都送 / 继续充值继续送"区分
  const cntRow=unlimited
    ? ''
    : `<div class="acc-row"><span class="l">${r.cnt}获奖次数</span><span class="v">${used}/${max}</span></div>`;
  const mid=cntRow
    + `<div class="acc-lines"><div class="ln"><span class="tri">🎯</span>${line1}</div><div class="ln"><span class="tri">🎯</span>${hint2}</div></div>`;
  const rows=SINGLE_TIERS.map(t=>`<div class="tier"><span class="amt-l">${money(t[0])}</span><span class="rwd">+${money(t[1])}</span></div>`).join('');
  return nav(r.prefix+'单笔充值加赠')
   + `<div class="banner">${bannerSVG()}</div>`
   + `<div class="coletavel"><span class="lb">可领取</span><span class="amt">${money(claimAmt)}</span></div>`
   + `<div class="body">${mid}<div class="tbl-hd"><span class="c1">充值金额</span><span class="c2">奖励金额</span></div>${rows}${rulesBlock(rulesSingle())}</div>`
   + `<div class="btnbar">${btn}</div>`;
}
function singleClaim(amt){
  openCongrats(amt);
  const next={ongoing:'claimed',alldone:'alldone',one:'oneclaimed'}[S.state];
  if(S.state==='alldone') SINGLE_STATE.alldone.claimed=85;   // 演示:领取后可领归零
  if(next && next!==S.state){ S.state=next; document.querySelectorAll('#seg-state button').forEach(b=>b.classList.toggle('on',b.dataset.v===next)); }
  render();
}

function renderSeq(){
  const guest=S.login==='out';
  const cfg=SEQ[S.days], n=cfg.n, done=guest?0:cfg.done, today=guest?0:cfg.today;   // 未登录=未开始(0/N,无今天)
  const allDone=done>=n;
  const pct=Math.round(done/n*100);
  const segEnd=n-1;
  const needScroll=segEnd>6;                 // 仅>6时固定6格并可滑动
  let tabs=[]; for(let s=1;s<=segEnd;s+=6) tabs.push([s,Math.min(s+5,segEnd)]);
  if(S.dayTab>=tabs.length)S.dayTab=0;
  const claimed=guest?false:((S.days==='21c')||S.seqClaimed);   // 连续奖励已领取且未重置(未登录时不适用)
  let cells='';
  for(let dd=1;dd<=segEnd;dd++){
    const isToday=(dd===today && today>0);
    const isDone=(dd<=done);
    let cls='cell',icon;
    if(isToday){
      cls+=' hoje';
      if(isDone){ cls+=' hoje-done'; icon='<span class="ic">✓</span>'; }      // 当天·已完成(黄色高亮+绿勾)
      else { icon='<span class="ic">🔥</span>'; }                              // 当天·未完成(进行中)
    } else if(isDone){
      cls+=' done'; icon='<span class="ic">✓</span>';                          // 过去·已完成(绿色卡)
    } else {
      icon='<span class="ic lock">🔒</span>';                                 // 未开始(锁)
    }
    // "今天"标记:卡片外部下方 ▲ + 今天
    const mk=isToday?'<span class="todaymk"><span class="mkar">▲</span>今天</span>':'';
    cells+=`<div class="${cls}" data-day="${dd}"><span class="d">${dd}</span>${icon}${mk}</div>`;
  }
  const lastCell=`<div class="lastcell"><span class="ld">${n}</span><span class="lic">🎁</span><span class="p">${money(SEQ_PRIZE)}</span></div>`;
  // 标签为固定模块(所有天数都显示,含2/4天);选中显示"天"字,未选中只有数字;不换行、无对勾
  const tabsHtml=`<div class="daytabs">${tabs.map((t,i)=>
    `<div class="daytab ${i===S.dayTab?'on':''}" data-i="${i}" data-start="${t[0]}">${t[0]}-${t[1]}${i===S.dayTab?'天':''}</div>`
  ).join('')}</div>`;
  const progTxt=claimed?'已领取,等待下一周期重置':(allDone?'连续挑战完成!今日可领取奖励!':`还差 ${n-done} 天,立即领取!`);
  // 进度行右侧:未达标显示"去充值"(点击跳转充值页);已达标/已领取显示"已达标"
  const depBtn=(allDone||claimed)?`<span class="badge">已达标</span>`:`<span class="dep" onclick="goRecharge()"><span class="dep-ic">💰</span>去充值<span class="dep-pg">${done}/${n}</span></span>`;
  // 主按钮三态:①领取-不可点(未达标) ②领取-可点(已达标可领) ③已领取-不可点(已领取未重置)
  let btn;
  if(claimed){ btn=`<div class="btn done seqbtn">已领取</div>`; }
  else if(allDone){ btn=`<div class="btn on seqbtn" onclick="seqClaim()">领取</div>`; }
  else { btn=`<div class="btn off seqbtn">领取</div>`; }
  return nav('充值连续挑战')
   + `<div class="seqhead"><span class="tag">超级大奖</span><div><div class="t1">每日充值 ${money(SEQ_DAILY)}<br>连续 ${n} 天</div><div class="t2">赢取大奖</div></div><div class="prize">${money(SEQ_PRIZE)}</div></div>`
   + `<div class="seqnote">中断连续将重置进度</div>`
   + `<div class="body">`
   +   `<div class="prog ${allDone||claimed?'done':''}"><div class="ring" style="--p:${pct}%"><i>${done}/${n}</i></div><span class="txt">${progTxt}</span>${depBtn}</div>`
   +   tabsHtml
   +   `<div class="track"><div class="cells${needScroll?' six':''}">${cells}</div>${lastCell}</div>`
   +   btn
   +   rulesBlock(RULES_SEQ)
   + `</div>`;
}
function seqClaim(){ openCongrats(SEQ_PRIZE); S.seqClaimed=true; render(); }
function bindTabs(){
  document.querySelectorAll('#screen .daytab').forEach(t=>{
    const start=t.dataset.start;
    t.onclick=()=>{
      S.dayTab=+t.dataset.i;
      render();  // 重渲染以更新"天"字标注,再定位到该段起始(天数格仍可手动左右滑)
      const wrap=document.querySelector('#screen .cells');
      const cell=wrap&&wrap.querySelector('.cell[data-day="'+start+'"]');
      if(cell&&wrap){ const max=wrap.scrollWidth-wrap.clientWidth; wrap.scrollLeft=Math.min(cell.offsetLeft,max); }
    };
  });
}

function buildState(){
  const set=S.mode==='single'?singleStateSet():STATE_SETS[S.mode]; if(!set) return;
  SINGLE_STATE.alldone.claimed=17;   // 恢复演示初值
  const box=document.getElementById('seg-state');
  box.innerHTML=set.map((o,i)=>`<button data-v="${o[0]}" class="${i===0?'on':''}">${o[1]}</button>`).join('');
  S.state=set[0][0];
  box.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.state=b.dataset.v;render();};
  });
}
function segClick(id,key,cb){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    b.onclick=()=>{document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S[key]=b.dataset.v;if(cb)cb();syncPanel();render();};
  });
}
function syncPanel(){
  const isDays=S.mode==='days';
  const guest=S.login==='out';
  const isSingle=S.mode==='single';
  // 连续天数、单笔充值强制实时领取 → 隐藏领取时间切换
  document.getElementById('grp-claim').style.display=(isDays||isSingle)?'none':'block';
  document.getElementById('grp-sreset').style.display=isSingle?'block':'none';
  document.getElementById('grp-smax').style.display=isSingle?'block':'none';
  document.getElementById('grp-state').style.display=(isDays||guest)?'none':'block';   // 未登录时状态强制"未开始",隐藏状态切换
  document.getElementById('grp-days').style.display=isDays?'block':'none';
}
segClick('seg-mode','mode',()=>{ if(S.mode==='days'){S.dayTab=0;} else {buildState();} });
segClick('seg-claim','claim');
segClick('seg-sreset','sreset');
segClick('seg-smax','smax',()=>{ buildState(); });
segClick('seg-login','login');
segClick('seg-days','days',()=>{S.dayTab=0;S.seqClaimed=false;});
buildState();syncPanel();render();
</script>
